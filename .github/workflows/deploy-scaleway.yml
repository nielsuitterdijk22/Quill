name: Deploy to Scaleway (serverless)

# Serverless deploy: build + push images to the Scaleway Container Registry,
# terraform apply (serverless containers/job get the new image tag), SSH-deploy
# the Forgejo VM stack when vm files change, sync DNS, health-check.
#
# Required GitHub repo secrets/variables (see deploy/scaleway/README.md):
#   secrets: SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_ORGANIZATION_ID,
#            VM_SSH_KEY, FORGEJO_ADMIN_TOKEN, ZITADEL_MANAGEMENT_TOKEN,
#            SDB_USER, SDB_PASSWORD
#   vars:    QUILL_DOMAIN, SCW_REGION, SCW_PROJECT_ID, BACKUP_BUCKET, REGISTRY,
#            VM_IP, LETSENCRYPT_EMAIL, NEXT_PUBLIC_ZITADEL_ISSUER,
#            NEXT_PUBLIC_ZITADEL_CLIENT_ID, NEXT_PUBLIC_ZITADEL_PROJECT_ID
# Optional (transactional email via Brevo — invites/activation/password-reset):
#   secrets: BREVO_SMTP_NAME, BREVO_SMTP_KEY
#   vars:    BREVO_SMTP_FROM (default no-reply@<QUILL_DOMAIN>),
#            BREVO_SMTP_HOST / BREVO_SMTP_PORT (defaults smtp-relay.brevo.com:587),
#            BREVO_SMTP_TEST_TO (send a test mail on deploy)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/scaleway/**"
      - ".github/workflows/deploy-scaleway.yml"
  workflow_dispatch:
    inputs:
      provision:
        description: "First boot only: run scripts/provision.sh (Forgejo admin + token + webhook, Zitadel PAT)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
  SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  TF_IN_AUTOMATION: "1"

jobs:
  # The Scaleway deploy only runs once the repo vars below are configured (they
  # come from `terraform apply` outputs — see deploy/scaleway/README.md). Until
  # then the workflow is skipped so main stays green; workflow_dispatch always runs.
  build:
    name: Build & push images
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    outputs:
      vm_changed: ${{ steps.changes.outputs.vm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vm:
              - "deploy/scaleway/vm/**"
              - "deploy/compose/**"

      - name: Login to Scaleway Container Registry
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login ${{ vars.REGISTRY }} \
            -u "${{ secrets.SCW_ACCESS_KEY }}" --password-stdin

      - name: Build backend image (api + dispatch)
        run: |
          docker build -t ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }} backend/
          docker push ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }} ${{ vars.REGISTRY }}/quill-backend:latest
          docker push ${{ vars.REGISTRY }}/quill-backend:latest

      - name: Build web image
        run: |
          docker build -t ${{ vars.REGISTRY }}/quill-web:${{ github.sha }} frontend/ \
            --build-arg NEXT_PUBLIC_AUTH_PROVIDER=zitadel \
            --build-arg NEXT_PUBLIC_ZITADEL_ISSUER=${{ vars.NEXT_PUBLIC_ZITADEL_ISSUER }} \
            --build-arg NEXT_PUBLIC_ZITADEL_CLIENT_ID=${{ vars.NEXT_PUBLIC_ZITADEL_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_ZITADEL_PROJECT_ID=${{ vars.NEXT_PUBLIC_ZITADEL_PROJECT_ID }} \
            --build-arg QUILL_API_BASE_URL=https://api.${{ vars.QUILL_DOMAIN }}
          docker push ${{ vars.REGISTRY }}/quill-web:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-web:${{ github.sha }} ${{ vars.REGISTRY }}/quill-web:latest
          docker push ${{ vars.REGISTRY }}/quill-web:latest

      - name: Build backup image
        run: |
          docker build -f deploy/scaleway/docker/backup.Dockerfile -t ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }} deploy/scaleway/docker/
          docker push ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }} ${{ vars.REGISTRY }}/quill-backup:latest
          docker push ${{ vars.REGISTRY }}/quill-backup:latest

      - name: Build zitadel image
        run: |
          docker build -f deploy/scaleway/docker/zitadel.Dockerfile -t ${{ vars.REGISTRY }}/quill-zitadel:${{ github.sha }} deploy/scaleway/docker/
          docker push ${{ vars.REGISTRY }}/quill-zitadel:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-zitadel:${{ github.sha }} ${{ vars.REGISTRY }}/quill-zitadel:latest
          docker push ${{ vars.REGISTRY }}/quill-zitadel:latest

  apply:
    name: Terraform apply (serverless)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init (state in Object Storage)
        working-directory: deploy/scaleway/terraform
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="endpoint=https://s3.${{ vars.SCW_REGION }}.scw.cloud" \
            -backend-config="bucket=${{ vars.BACKUP_BUCKET }}-tfstate" \
            -backend-config="key=quill.tfstate" \
            -backend-config="region=${{ vars.SCW_REGION }}" \
            -backend-config="access_key=${{ secrets.SCW_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SCW_SECRET_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_requesting_account_id=true"

      - name: Terraform apply
        working-directory: deploy/scaleway/terraform
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          terraform apply -auto-approve -input=false \
            -var "image_tag=${{ github.sha }}" \
            -var "domain=${{ vars.QUILL_DOMAIN }}" \
            -var "backup_bucket_name=${{ vars.BACKUP_BUCKET }}" \
            -var "letsencrypt_email=${{ vars.LETSENCRYPT_EMAIL }}" \
            -var "forgejo_admin_token=${{ secrets.FORGEJO_ADMIN_TOKEN }}" \
            -var "zitadel_management_token=${{ secrets.ZITADEL_MANAGEMENT_TOKEN }}" \
            -var "sdb_user=${{ secrets.SDB_USER }}" \
            -var "sdb_password=${{ secrets.SDB_PASSWORD }}" \
            -var "create_dns_zone=false" \
            -var "brevo_smtp_user=${{ secrets.BREVO_SMTP_NAME }}" \
            -var "brevo_smtp_password=${{ secrets.BREVO_SMTP_KEY }}" \
            -var "brevo_smtp_from=${{ vars.BREVO_SMTP_FROM }}"

  vm-deploy:
    name: Deploy Forgejo VM stack (SSH)
    needs: [build, apply]
    if: ${{ needs.build.outputs.vm_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy to the Forgejo VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VM_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/quill
            # Transactional mail (Brevo): compose auto-merges docker-compose.override.yml.
            # Forgejo reads [mailer] env on every start; Zitadel's env-based SMTP only
            # applies at instance creation, so the mail-config job also pushes the same
            # settings through the admin API on the running instance.
            if [ -n "${{ secrets.BREVO_SMTP_KEY }}" ]; then
              umask 077
              sudo tee docker-compose.override.yml >/dev/null <<'YAML'
            services:
              forgejo:
                environment:
                  FORGEJO__mailer__ENABLED: "true"
                  FORGEJO__mailer__MAILER_TYPE: smtp
                  FORGEJO__mailer__HOST: "${{ vars.BREVO_SMTP_HOST || 'smtp-relay.brevo.com' }}:${{ vars.BREVO_SMTP_PORT || '587' }}"
                  FORGEJO__mailer__USER: "${{ secrets.BREVO_SMTP_NAME }}"
                  FORGEJO__mailer__PASSWD: "${{ secrets.BREVO_SMTP_KEY }}"
                  FORGEJO__mailer__FROM: "${{ vars.BREVO_SMTP_FROM || format('no-reply@{0}', vars.QUILL_DOMAIN) }}"
                  FORGEJO__mailer__SUBJECT_PREFIX: "[Quill] "
                  FORGEJO__mailer__IS_TLS_ENABLED: "false"
              zitadel:
                environment:
                  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: "${{ vars.BREVO_SMTP_HOST || 'smtp-relay.brevo.com' }}:${{ vars.BREVO_SMTP_PORT || '587' }}"
                  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: "${{ secrets.BREVO_SMTP_NAME }}"
                  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: "${{ secrets.BREVO_SMTP_KEY }}"
                  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "true"
                  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: "${{ vars.BREVO_SMTP_FROM || format('no-reply@{0}', vars.QUILL_DOMAIN) }}"
                  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: "Quill"
                  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_REPLYTOADDRESS: "${{ vars.BREVO_SMTP_FROM || format('no-reply@{0}', vars.QUILL_DOMAIN) }}"
            YAML
            else
              sudo rm -f docker-compose.override.yml
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f >/dev/null 2>&1 || true

  mail-config:
    name: Configure Zitadel SMTP (Brevo) via admin API
    needs: [build, apply, vm-deploy]
    # NOTE: the secrets context is not allowed in a job-level if — the
    # "are Brevo creds set?" guard runs inside the step instead.
    if: ${{ needs.build.outputs.vm_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply SMTP settings on the running Zitadel instance
        env:
          ZITADEL_URL: https://auth.${{ vars.QUILL_DOMAIN }}
          ZITADEL_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_TOKEN }}
          SMTP_HOST: ${{ vars.BREVO_SMTP_HOST || 'smtp-relay.brevo.com' }}:${{ vars.BREVO_SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.BREVO_SMTP_NAME }}
          SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_KEY }}
          SMTP_FROM: ${{ vars.BREVO_SMTP_FROM || format('no-reply@{0}', vars.QUILL_DOMAIN) }}
          SMTP_FROM_NAME: Quill
          SMTP_TEST_TO: ${{ vars.BREVO_SMTP_TEST_TO }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "BREVO_SMTP_NAME / BREVO_SMTP_KEY not set — skipping mail config (email disabled)"
            exit 0
          fi
          deploy/scaleway/scripts/zitadel-smtp.sh

  provision:
    name: First-boot provision
    needs: [build, apply]
    if: ${{ inputs.provision == true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install scw CLI
        run: |
          curl -sL https://github.com/scaleway/scaleway-cli/releases/download/v2.65.2/scaleway-cli_2.65.2_linux_amd64 | sudo tee /usr/local/bin/scw >/dev/null && sudo chmod +x /usr/local/bin/scw

      - name: Run provision.sh
        env:
          QUILL_DOMAIN: ${{ vars.QUILL_DOMAIN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
        run: deploy/scaleway/scripts/provision.sh

  post:
    name: DNS sync + health check
    needs: [build, apply]
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install scw CLI
        run: |
          curl -sL https://github.com/scaleway/scaleway-cli/releases/download/v2.65.2/scaleway-cli_2.65.2_linux_amd64 | sudo tee /usr/local/bin/scw >/dev/null && sudo chmod +x /usr/local/bin/scw

      - name: Sync git/ssh DNS records to the VM IP
        env:
          QUILL_DOMAIN: ${{ vars.QUILL_DOMAIN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
        run: deploy/scaleway/scripts/dns-sync.sh

      - name: Health check
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://app.${{ vars.QUILL_DOMAIN }}/login" \
               && curl -fsS -o /dev/null "https://git.${{ vars.QUILL_DOMAIN }}/api/healthz"; then
              echo "app + git are serving"
              exit 0
            fi
            sleep 15
          done
          echo "::error::app/git not reachable after 10 min" >&2
          exit 1
