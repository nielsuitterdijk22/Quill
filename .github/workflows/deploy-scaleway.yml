name: Deploy to Scaleway (serverless)

# Serverless deploy: build + push images to the Scaleway Container Registry,
# terraform apply (serverless containers/jobs get the new image tag),
# health-check. There is no VM since 2026-11-14.
#
# Required GitHub repo secrets/variables (see deploy/scaleway/README.md):
#   secrets: SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_ORGANIZATION_ID,
#            FORGEJO_ADMIN_TOKEN (legacy, unused), ZITADEL_MANAGEMENT_TOKEN,
#            SDB_USER, SDB_PASSWORD
#   vars:    QUILL_DOMAIN, SCW_REGION, SCW_PROJECT_ID, BACKUP_BUCKET, REGISTRY,
#            LETSENCRYPT_EMAIL, NEXT_PUBLIC_ZITADEL_ISSUER,
#            NEXT_PUBLIC_ZITADEL_CLIENT_ID, NEXT_PUBLIC_ZITADEL_PROJECT_ID
# Optional (transactional email via Brevo — invites/activation/password-reset):
#   secrets: BREVO_SMTP_NAME, BREVO_SMTP_KEY
#   vars:    BREVO_SMTP_FROM (default info@<parent of QUILL_DOMAIN>),
#            BREVO_SMTP_HOST / BREVO_SMTP_PORT (defaults smtp-relay.brevo.com:2525),
#            BREVO_SMTP_TEST_TO (send a test mail on deploy)

# Pinned deployment domain: the Scaleway stack serves *.black-tulip.nl (apex).
# vars.QUILL_DOMAIN is intentionally not used for hosts anymore — the migration to
# the apex is done; set the records at the registrar accordingly.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/scaleway/**"
      - ".github/workflows/deploy-scaleway.yml"
  workflow_dispatch:
    inputs:
      provision:
        description: "First boot only: run scripts/provision.sh (Forgejo admin + token + webhook, Zitadel PAT)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
  SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  TF_IN_AUTOMATION: "1"

jobs:
  # The Scaleway deploy only runs once the repo vars below are configured (they
  # come from `terraform apply` outputs — see deploy/scaleway/README.md). Until
  # then the workflow is skipped so main stays green; workflow_dispatch always runs.
  build:
    name: Build & push images
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Login to Scaleway Container Registry
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login ${{ vars.REGISTRY }} \
            -u "${{ secrets.SCW_ACCESS_KEY }}" --password-stdin

      - name: Build backend image (api + dispatch)
        run: |
          docker build -t ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }} backend/
          docker push ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }} ${{ vars.REGISTRY }}/quill-backend:latest
          docker push ${{ vars.REGISTRY }}/quill-backend:latest

      - name: Build web image
        run: |
          docker build -t ${{ vars.REGISTRY }}/quill-web:${{ github.sha }} frontend/ \
            --build-arg NEXT_PUBLIC_AUTH_PROVIDER=zitadel \
            --build-arg NEXT_PUBLIC_ZITADEL_ISSUER=https://auth.black-tulip.nl \
            --build-arg NEXT_PUBLIC_ZITADEL_CLIENT_ID=${{ vars.NEXT_PUBLIC_ZITADEL_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_ZITADEL_PROJECT_ID=${{ vars.NEXT_PUBLIC_ZITADEL_PROJECT_ID }} \
            --build-arg QUILL_API_BASE_URL=https://api.black-tulip.nl \
            --build-arg NEXT_PUBLIC_API_WS_URL=wss://api.black-tulip.nl \
            --build-arg NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
          docker push ${{ vars.REGISTRY }}/quill-web:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-web:${{ github.sha }} ${{ vars.REGISTRY }}/quill-web:latest
          docker push ${{ vars.REGISTRY }}/quill-web:latest

      - name: Build backup image
        run: |
          docker build -f deploy/scaleway/docker/backup.Dockerfile -t ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }} deploy/scaleway/docker/
          docker push ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }} ${{ vars.REGISTRY }}/quill-backup:latest
          docker push ${{ vars.REGISTRY }}/quill-backup:latest

      - name: Build zitadel image
        run: |
          docker build -f deploy/scaleway/docker/zitadel.Dockerfile -t ${{ vars.REGISTRY }}/quill-zitadel:${{ github.sha }} deploy/scaleway/docker/
          docker push ${{ vars.REGISTRY }}/quill-zitadel:${{ github.sha }}
          docker tag ${{ vars.REGISTRY }}/quill-zitadel:${{ github.sha }} ${{ vars.REGISTRY }}/quill-zitadel:latest
          docker push ${{ vars.REGISTRY }}/quill-zitadel:latest

  apply:
    name: Terraform apply (serverless)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init (state in Object Storage)
        working-directory: deploy/scaleway/terraform
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="endpoint=https://s3.${{ vars.SCW_REGION }}.scw.cloud" \
            -backend-config="bucket=${{ vars.BACKUP_BUCKET }}-tfstate" \
            -backend-config="key=quill.tfstate" \
            -backend-config="region=${{ vars.SCW_REGION }}" \
            -backend-config="access_key=${{ secrets.SCW_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SCW_SECRET_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_requesting_account_id=true"

      - name: Terraform apply
        working-directory: deploy/scaleway/terraform
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        # NOTE: no comments inside the run block — a '#' line after a '\'
        # continuation ends the command early (that is how apply lost its -vars).
        # image_tag is pinned to the git SHA: a pinned "latest" made apply a
        # no-op on the containers (registry_image unchanged), and Scaleway does
        # NOT reliably re-pull the same tag — deploys silently didn't land until
        # someone ran `scw container container redeploy` by hand. A per-sha pin
        # changes registry_image on every apply, which forces a new container
        # revision and a real deployment.
        run: |
          terraform apply -auto-approve -input=false \
            -var "image_tag=${{ github.sha }}" \
            -var "domain=black-tulip.nl" \
            -var "backup_bucket_name=${{ vars.BACKUP_BUCKET }}" \
            -var "repos_bucket_name=${{ vars.REPOS_BUCKET || 'quill-mvp-repos-x7f2k9' }}" \
            -var "letsencrypt_email=${{ vars.LETSENCRYPT_EMAIL }}" \
            -var "forgejo_admin_token=${{ secrets.FORGEJO_ADMIN_TOKEN }}" \
            -var "zitadel_management_token=${{ secrets.ZITADEL_MANAGEMENT_TOKEN }}" \
            -var "zitadel_client_secret=${{ secrets.ZITADEL_CLIENT_SECRET }}" \
            -var "sdb_user=${{ secrets.SDB_USER }}" \
            -var "sdb_password=${{ secrets.SDB_PASSWORD }}" \
            -var "dispatch_secret=${{ secrets.DISPATCH_SECRET }}" \
            -var "create_dns_zone=false" \
            -var "brevo_smtp_user=${{ secrets.BREVO_SMTP_NAME }}" \
            -var "brevo_smtp_password=${{ secrets.BREVO_SMTP_KEY }}" \
            -var "brevo_smtp_from=${{ vars.BREVO_SMTP_FROM }}" \
            -var "github_client_id=${{ secrets.GH_CLIENT_ID || secrets.GH_OAUTH_CLIENT_ID || secrets.GH_OAUTH_CLIENTID || secrets.GH_APP_CLIENT_ID || 'unset' }}" \
            -var "github_client_secret=${{ secrets.GH_CLIENT_SECRET || secrets.GH_OAUTH_CLIENT_SECRET || secrets.GH_OAUTH_CLIENTSECRET || secrets.GH_APP_CLIENT_SECRET || 'unset' }}" \
            -var "creem_api_key=${{ secrets.CREEM_API_KEY }}" \
            -var "creem_webhook_secret=${{ secrets.CREEM_WEBHOOK_SECRET }}" \
            -var "creem_pro_product_id=prod_1DLhjZE8dsNwtheT4wHD8H" \
            -var "creem_team_product_id=prod_7lBOuo7Sq1fahYN6DpQvP"

      - name: Run zitadel setup job (migrations outside the serving path)
        # Serverless epic, PR C1: `zitadel setup` runs as a Serverless Job after
        # each apply — never in the container boot path (cold starts must not
        # race migrations). Until the auth.<domain> DNS record is flipped to
        # the zitadel container, the VM keeps serving auth; the job keeps the
        # SDB schema current so cutover is one DNS change.
        working-directory: deploy/scaleway/terraform
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
          SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          # Fresh HOME makes scw's update check fire every run and print a
          # version banner to STDOUT, which broke the JSON parse below
          # ("Expecting value: line 1 column 1").
          SCW_DISABLE_CHECK_VERSION: "true"
        run: |
          set -euo pipefail
          mkdir -p ~/.config/scw
          echo '{"default_zone":"fr-par-1"}' > ~/.config/scw/config.yaml
          curl -sL --retry 3 https://github.com/scaleway/scaleway-cli/releases/download/v2.65.2/scaleway-cli_2.65.2_linux_amd64 -o /tmp/scw && chmod +x /tmp/scw
          /tmp/scw version >/dev/null # fail fast on a corrupt download
          # terraform outputs region-qualified ids (fr-par/<uuid>); the scw
          # CLI wants the bare UUID.
          JOB_DEF_ID="$(terraform output -raw zitadel_setup_job_id)"
          JOB_DEF_ID="${JOB_DEF_ID##*/}"
          START_OUT="$(/tmp/scw -o json jobs definition start "$JOB_DEF_ID")" || { echo "job start failed: $START_OUT" >&2; exit 1; }
          RUN_ID="$(echo "$START_OUT" | python3 -c 'import sys,json; s=sys.stdin.read(); s=s[s.index("{"):]; print(json.loads(s)["job_runs"][0]["id"])')"
          echo "zitadel setup job run: $RUN_ID (logs: scw jobs run get $RUN_ID)"
          # Poll instead of `jobs run wait`: the wait exits silently with an
          # empty/non-JSON body in CI runners (observed 2026-11-13), and the
          # job-run object carries `state` (lowercase succeeded/failed) — scw
          # CLI v2.65 never emits `status`.
          STATE=""
          for _ in $(seq 1 120); do
            STATE="$(/tmp/scw -o json jobs run get "$RUN_ID" | python3 -c 'import sys,json; s=sys.stdin.read(); s=s[s.index("{"):]; print(json.loads(s).get("state",""))' 2>/dev/null || true)"
            case "$STATE" in succeeded|failed|error) break ;; esac
            sleep 5
          done
          echo "job state: $STATE"
          [ "$STATE" = "succeeded" ] || { echo "zitadel setup job did not succeed"; exit 1; }

  mail-config:
    name: Configure Zitadel SMTP (Brevo) via admin API
    needs: [build, apply]
    # NOTE: the secrets context is not allowed in a job-level if — the
    # "are Brevo creds set?" guard runs inside the step instead. Manual runs
    # only since the VM is gone (Zitadel is serverless; settings persist).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply SMTP settings on the running Zitadel instance
        env:
          ZITADEL_URL: https://auth.black-tulip.nl
          ZITADEL_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_TOKEN }}
          SMTP_HOST: ${{ vars.BREVO_SMTP_HOST || 'smtp-relay.brevo.com' }}:${{ vars.BREVO_SMTP_PORT || '2525' }}
          SMTP_USER: ${{ secrets.BREVO_SMTP_NAME }}
          SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_KEY }}
          SMTP_FROM: ${{ vars.BREVO_SMTP_FROM }}
          QUILL_DOMAIN: black-tulip.nl
          SMTP_FROM_NAME: Quill
          SMTP_TEST_TO: ${{ vars.BREVO_SMTP_TEST_TO }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "BREVO_SMTP_NAME / BREVO_SMTP_KEY not set — skipping mail config (email disabled)"
            exit 0
          fi
          export SMTP_FROM="${SMTP_FROM:-info@$(echo "$QUILL_DOMAIN" | cut -d. -f2-)}"
          deploy/scaleway/scripts/zitadel-smtp.sh
          QUILL_APP_URL="https://app.black-tulip.nl" deploy/scaleway/scripts/zitadel-brand.sh

  provision:
    name: First-boot provision
    needs: [build, apply]
    if: ${{ inputs.provision == true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install scw CLI
        run: |
          curl -sL https://github.com/scaleway/scaleway-cli/releases/download/v2.65.2/scaleway-cli_2.65.2_linux_amd64 | sudo tee /usr/local/bin/scw >/dev/null && sudo chmod +x /usr/local/bin/scw

      - name: Run provision.sh
        env:
          QUILL_DOMAIN: black-tulip.nl
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
        run: deploy/scaleway/scripts/provision.sh

  post:
    name: Health check
    needs: [build, apply]
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install scw CLI
        run: |
          curl -sL https://github.com/scaleway/scaleway-cli/releases/download/v2.65.2/scaleway-cli_2.65.2_linux_amd64 | sudo tee /usr/local/bin/scw >/dev/null && sudo chmod +x /usr/local/bin/scw

      - name: Health check
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://app.black-tulip.nl/login" \
               && curl -fsS -o /dev/null "https://api.black-tulip.nl/healthz"; then
              echo "app + api are serving"
              exit 0
            fi
            sleep 15
          done
          echo "::error::app/api not reachable after 10 min" >&2
          exit 1
