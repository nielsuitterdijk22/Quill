name: Deploy to Scaleway (Kapsule)

# Cloud-native deploy: build images, push to the Scaleway Container Registry,
# render + apply the k8s manifests to the Kapsule cluster, verify health.
#
# Required GitHub repo secrets/variables (see deploy/scaleway/README.md):
#   secrets: SCW_CI_ACCESS_KEY, SCW_CI_SECRET_KEY, KUBE_CONFIG
#   vars:    QUILL_DOMAIN, SCW_REGION, SCW_PROJECT_ID, RDB_HOST, BACKUP_BUCKET,
#            REGISTRY, LETSENCRYPT_EMAIL, NEXT_PUBLIC_ZITADEL_ISSUER,
#            NEXT_PUBLIC_ZITADEL_CLIENT_ID, NEXT_PUBLIC_ZITADEL_PROJECT_ID

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/scaleway/**"
      - ".github/workflows/deploy-scaleway.yml"
  workflow_dispatch:
    inputs:
      provision:
        description: "First boot only: run k8s-provision.sh (Forgejo admin + token)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
  SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}

jobs:
  # The Scaleway deploy only runs once the repo vars below are configured (they
  # come from `terraform apply` outputs — see deploy/scaleway/README.md). Until
  # then the workflow is skipped so main stays green; workflow_dispatch always
  # runs (useful for the first boot with provision=true).
  build:
    name: Build & push images
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        run: |
          echo "${{ secrets.SCW_CI_SECRET_KEY }}" | docker login ${{ vars.REGISTRY }} \
            -u "${{ secrets.SCW_CI_ACCESS_KEY }}" --password-stdin

      - name: Build backend image (api + dispatch)
        run: |
          docker build -t ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }} backend/
          docker push ${{ vars.REGISTRY }}/quill-backend:${{ github.sha }}

      - name: Build web image
        run: |
          docker build -t ${{ vars.REGISTRY }}/quill-web:${{ github.sha }} frontend/ \
            --build-arg NEXT_PUBLIC_AUTH_PROVIDER=zitadel \
            --build-arg NEXT_PUBLIC_ZITADEL_ISSUER=${{ vars.NEXT_PUBLIC_ZITADEL_ISSUER }} \
            --build-arg NEXT_PUBLIC_ZITADEL_CLIENT_ID=${{ vars.NEXT_PUBLIC_ZITADEL_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_ZITADEL_PROJECT_ID=${{ vars.NEXT_PUBLIC_ZITADEL_PROJECT_ID }} \
            --build-arg QUILL_API_BASE_URL=http://api:8080
          docker push ${{ vars.REGISTRY }}/quill-web:${{ github.sha }}

      - name: Build backup image
        run: |
          docker build -t ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }} deploy/scaleway/docker/
          docker push ${{ vars.REGISTRY }}/quill-backup:${{ github.sha }}

  deploy:
    name: Deploy to Kapsule
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SCW_REGION != '' && vars.QUILL_DOMAIN != '' && vars.REGISTRY != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl + scw CLI
        run: |
          curl -LO "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl -sL https://github.com/scaleway/scaleway-cli/releases/download/v2.42.0/scaleway-cli_2.42.0_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin scw

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      - name: Sync app secrets from Secret Manager
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          SCW_ACCESS_KEY: ${{ secrets.SCW_CI_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_CI_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
        run: deploy/scaleway/scripts/sync-secrets.sh

      - name: Render manifests
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          QUILL_DOMAIN: ${{ vars.QUILL_DOMAIN }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          RDB_HOST: ${{ vars.RDB_HOST }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          REGISTRY: ${{ vars.REGISTRY }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          BACKUP_RETENTION_DAYS: "30"
        run: deploy/scaleway/scripts/render.sh "$RUNNER_TEMP/rendered"

      - name: Apply manifests
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: kubectl apply -f "$RUNNER_TEMP/rendered/"

      - name: Rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          for d in forgejo api web dispatch zitadel; do
            kubectl -n quill rollout status "deploy/$d" --timeout=600s || true
          done
          kubectl -n quill get pods -o wide

      - name: First-boot provision (Forgejo admin token) — opt-in
        if: inputs.provision == true
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          QUILL_DOMAIN: ${{ vars.QUILL_DOMAIN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_CI_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_CI_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          STORE_IN_SECRET_MANAGER: "1"
        run: deploy/scaleway/scripts/k8s-provision.sh

      - name: Sync DNS records to the LB IPs
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          QUILL_DOMAIN: ${{ vars.QUILL_DOMAIN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_CI_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_CI_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
        run: deploy/scaleway/scripts/dns-sync.sh

      - name: Health check
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://app.${{ vars.QUILL_DOMAIN }}/login"; then
              echo "app.${{ vars.QUILL_DOMAIN }} is serving"
              exit 0
            fi
            sleep 15
          done
          echo "::error::app not reachable after 10 min" >&2
          exit 1
