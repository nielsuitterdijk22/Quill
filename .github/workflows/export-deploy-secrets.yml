name: One-off - export deploy secrets to Scaleway Secret Manager

# 2026-11-14: the deploy moves to Quill CI, which reads its configuration from
# Scaleway Secret Manager (/quill/deploy/*). This copies the GitHub-only
# secrets there once, never printing a value. Deleted after its run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Copy secrets
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          V_ZITADEL_CLIENT_SECRET: ${{ secrets.ZITADEL_CLIENT_SECRET }}
          V_ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_TOKEN }}
          V_GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          V_GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          V_BREVO_SMTP_NAME: ${{ secrets.BREVO_SMTP_NAME }}
          V_BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          V_CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          V_CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET }}
          V_DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          V_SDB_USER: ${{ secrets.SDB_USER }}
          V_SDB_PASSWORD: ${{ secrets.SDB_PASSWORD }}
          V_FORGEJO_ADMIN_TOKEN: ${{ secrets.FORGEJO_ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.parse
          api = "https://api.scaleway.com/secret-manager/v1beta1/regions/fr-par"
          hdr = {"X-Auth-Token": os.environ["SCW_SECRET_KEY"], "Content-Type": "application/json"}
          project = os.environ["SCW_PROJECT_ID"]
          def call(method, path, body=None):
              req = urllib.request.Request(api + path, method=method, headers=hdr,
                                           data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read() or b"{}")
          names = sorted(k[2:] for k in os.environ if k.startswith("V_"))
          for name in names:
              value = os.environ["V_" + name]
              sm = "deploy-" + name.lower().replace("_", "-")
              if not value:
                  print(f"{name}: empty on GitHub, skipped")
                  continue
              q = urllib.parse.urlencode({"project_id": project, "name": sm, "path": "/quill/deploy"})
              found = call("GET", "/secrets?" + q).get("secrets", [])
              sid = found[0]["id"] if found else call("POST", "/secrets", {
                  "project_id": project, "name": sm, "path": "/quill/deploy",
                  "description": f"Deploy pipeline input {name} (exported from GitHub 2026-11-14)"})["id"]
              call("POST", f"/secrets/{sid}/versions", {"data": base64.b64encode(value.encode()).decode()})
              print(f"{name}: stored as /quill/deploy/{sm} ({len(value)} chars)")
          PY
