# TEMPLATE ONLY — never commit real values and never `kubectl apply` this file
# directly. scripts/sync-secrets.sh renders it from Scaleway Secret Manager
# (or CI env) into a temp file and applies that, so the in-cluster Secret always
# matches Secret Manager.
#
# Required keys (all stringData):
#   QUILL_JWT_SECRET            — /quill/app/jwt-secret
#   QUILL_SECRET_ENCRYPTION_KEY — /quill/app/secret-encryption-key (base64 32B)
#   QUILL_WEBHOOK_SECRET        — /quill/app/webhook-secret
#   QUILL_PIPELINE_DISPATCH_SECRET — /quill/app/dispatch-secret
#   FORGEJO_ADMIN_TOKEN         — /quill/app/forgejo-admin-token (placeholder until
#                                 scripts/k8s-provision.sh mints the real token)
#   QUILL_DATABASE_URL          — /quill/app/quill-database-url (postgres://...@<rdb-private-ip>:5432/quill?sslmode=require)
#   RDB_ADMIN_PASSWORD          — /quill/rdb/rdb-admin-password (Forgejo + Zitadel admin DB password)
#   ZITADEL_DB_PASSWORD         — /quill/rdb/zitadel-db-password
#   ZITADEL_MASTERKEY           — /quill/zitadel/zitadel-masterkey
#   ZITADEL_MANAGEMENT_TOKEN    — machine-user PAT for the Zitadel Management API (set after bootstrap)
#   AWS_ACCESS_KEY_ID           — /quill/backup/s3-access-key (backup CronJob)
#   AWS_SECRET_ACCESS_KEY       — /quill/backup/s3-secret-key
#   AUTH_SECRET                 — NextAuth secret (same value as QUILL_JWT_SECRET by convention)
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET — optional GitHub OAuth sign-in
apiVersion: v1
kind: Secret
metadata:
  name: quill-app-secrets
  namespace: quill
type: Opaque
stringData:
  QUILL_JWT_SECRET: "${QUILL_JWT_SECRET}"
  QUILL_SECRET_ENCRYPTION_KEY: "${QUILL_SECRET_ENCRYPTION_KEY}"
  QUILL_WEBHOOK_SECRET: "${QUILL_WEBHOOK_SECRET}"
  QUILL_PIPELINE_DISPATCH_SECRET: "${QUILL_PIPELINE_DISPATCH_SECRET}"
  FORGEJO_ADMIN_TOKEN: "${FORGEJO_ADMIN_TOKEN}"
  QUILL_DATABASE_URL: "${QUILL_DATABASE_URL}"
  RDB_ADMIN_PASSWORD: "${RDB_ADMIN_PASSWORD}"
  ZITADEL_DB_PASSWORD: "${ZITADEL_DB_PASSWORD}"
  ZITADEL_MASTERKEY: "${ZITADEL_MASTERKEY}"
  ZITADEL_MANAGEMENT_TOKEN: "${ZITADEL_MANAGEMENT_TOKEN}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AUTH_SECRET: "${AUTH_SECRET}"
  GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
  GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
