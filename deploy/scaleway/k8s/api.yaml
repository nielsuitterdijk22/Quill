# Quill API (Go backend). One replica on purpose: Forgejo webhooks hit the
# service and may be processed twice with >1 replica until trigger idempotency
# lands — scale out after that follow-up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: quill
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: "${REGISTRY}/quill-backend:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          command: ["/quill-api"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: quill-config }
          env:
            - name: QUILL_DATABASE_URL
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: QUILL_DATABASE_URL } }
            - name: QUILL_JWT_SECRET
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: QUILL_JWT_SECRET } }
            - name: QUILL_SECRET_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: QUILL_SECRET_ENCRYPTION_KEY } }
            - name: QUILL_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: QUILL_WEBHOOK_SECRET } }
            - name: QUILL_PIPELINE_DISPATCH_SECRET
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: QUILL_PIPELINE_DISPATCH_SECRET } }
            - name: FORGEJO_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: FORGEJO_ADMIN_TOKEN } }
            - name: ZITADEL_MANAGEMENT_TOKEN
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: ZITADEL_MANAGEMENT_TOKEN } }
            - name: GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: GITHUB_CLIENT_ID } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: GITHUB_CLIENT_SECRET } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: quill
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8080, targetPort: http }
