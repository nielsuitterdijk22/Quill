# Quill web (Next.js). Stateless — 2 replicas. NEXT_PUBLIC_* values are baked
# into the image at build time by CI (deploy-scaleway.yml), runtime env comes
# from the configmap/secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: quill
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: "${REGISTRY}/quill-web:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - configMapRef: { name: quill-config }
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              valueFrom: { configMapKeyRef: { name: quill-config, key: WEB_PORT } }
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: AUTH_SECRET } }
            - name: AUTH_URL
              valueFrom: { configMapKeyRef: { name: quill-config, key: AUTH_URL } }
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: quill
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 3001, targetPort: http }
