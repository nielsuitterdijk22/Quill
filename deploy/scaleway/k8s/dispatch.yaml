# Pipeline dispatcher. Runs nektos/act against a Docker daemon provided by a
# DinD sidecar (docker:dind, no TLS, localhost-only).
#
# SECURITY NOTE (MVP trade-off, same as the compose stack's socket mount):
# the dind sidecar is privileged and pipeline code effectively gets root on the
# node. The follow-up is moving runners to Forge (hardened ephemeral runners);
# until then, only trusted users may trigger pipelines (RBAC on the trigger
# endpoint + branch policies).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  namespace: quill
  labels: { app: dispatch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dispatch }
  template:
    metadata:
      labels: { app: dispatch }
    spec:
      containers:
        - name: dispatch
          image: "${REGISTRY}/quill-backend:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          command: ["/quill-dispatch"]
          ports:
            - { name: http, containerPort: 8090 }
          envFrom:
            - configMapRef: { name: quill-config }
          env:
            - name: QUILL_HTTP_ADDR
              value: ":8090"
            - name: QUILL_PIPELINE_DISPATCH_SECRET
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: QUILL_PIPELINE_DISPATCH_SECRET } }
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "2", memory: 2Gi }
        - name: dind
          image: docker:27-dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true  # required for nested containerd/iptables; see note above
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""  # plain TCP on localhost only
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch
  namespace: quill
  labels: { app: dispatch }
spec:
  selector: { app: dispatch }
  ports:
    - { name: http, port: 8090, targetPort: http }
