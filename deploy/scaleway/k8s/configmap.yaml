# Non-secret configuration. Rendered by scripts/render.sh (envsubst) before
# kubectl apply — the ${...} placeholders are filled from scripts/sync-config.sh
# (Terraform outputs) or environment variables in CI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quill-config
  namespace: quill
data:
  QUILL_DOMAIN: "${QUILL_DOMAIN}"
  APP_HOST: "app.${QUILL_DOMAIN}"
  GIT_HOST: "git.${QUILL_DOMAIN}"
  AUTH_HOST: "auth.${QUILL_DOMAIN}"
  SSH_HOST: "ssh.${QUILL_DOMAIN}"

  # Region / backup target
  SCW_REGION: "${SCW_REGION}"
  BACKUP_BUCKET: "${BACKUP_BUCKET}"
  S3_ENDPOINT: "https://s3.${SCW_REGION}.scw.cloud"

  # Managed Postgres (RDB) — private IP on the shared VPC private network.
  RDB_HOST: "${RDB_HOST}"
  RDB_PORT: "5432"

  # Quill API
  QUILL_ENV: "production"
  QUILL_HTTP_ADDR: ":8080"
  QUILL_LOG_FORMAT: "json"
  QUILL_API_BASE_URL: "http://api:8080"
  QUILL_CORS_ALLOWED_ORIGINS: "https://app.${QUILL_DOMAIN}"
  QUILL_PIPELINE_DISPATCH_URL: "http://dispatch:8090"
  QUILL_AUTH_PROVIDER: "zitadel"
  ZITADEL_ISSUER: "https://auth.${QUILL_DOMAIN}"

  # Forgejo (internal + public URLs)
  FORGEJO_BASE_URL: "http://forgejo:3000"
  FORGEJO_PUBLIC_URL: "https://git.${QUILL_DOMAIN}"
  FORGEJO__server__DOMAIN: "git.${QUILL_DOMAIN}"
  FORGEJO__server__ROOT_URL: "https://git.${QUILL_DOMAIN}/"
  FORGEJO__server__SSH_DOMAIN: "ssh.${QUILL_DOMAIN}"
  FORGEJO__server__SSH_PORT: "2222"
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
  FORGEJO__server__LFS_START_SERVER: "true"
  FORGEJO__database__DB_TYPE: "postgres"
  FORGEJO__database__HOST: "${RDB_HOST}:5432"
  FORGEJO__database__NAME: "forgejo"
  FORGEJO__database__USER: "quill"
  FORGEJO__database__SSL_MODE: "require"

  # Zitadel
  ZITADEL_EXTERNALDOMAIN: "auth.${QUILL_DOMAIN}"
  ZITADEL_EXTERNALPORT: "443"
  ZITADEL_EXTERNALSECURE: "true"
  ZITADEL_TLS_MODE: "external"
  ZITADEL_DATABASE_POSTGRES_HOST: "${RDB_HOST}"
  ZITADEL_DATABASE_POSTGRES_PORT: "5432"
  ZITADEL_DATABASE_POSTGRES_DATABASE: "zitadel"
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: "zitadel"
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: "require"
  ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: "quill"
  ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: "require"

  # Frontend runtime
  WEB_PORT: "3001"
  AUTH_URL: "https://app.${QUILL_DOMAIN}"
