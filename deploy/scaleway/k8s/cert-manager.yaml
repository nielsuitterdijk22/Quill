# ClusterIssuer for Let's Encrypt via DNS-01 on Scaleway DNS.
# Prerequisites (scripts/bootstrap-cluster.sh):
#   1. cert-manager installed (kubectl apply cert-manager manifests)
#   2. scaleway cert-manager webhook installed (helm scaleway/cert-manager-webhook-scaleway)
#   3. secret `scaleway-dns-creds` in namespace cert-manager with keys
#      SCW_ACCESS_KEY / SCW_SECRET_KEY (the quill-ci-deployer API key — has DNSFullAccess)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-scaleway
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${LETSENCRYPT_EMAIL}"
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.scaleway.com
            solverName: scaleway
            config:
              accessKeySecretRef:
                name: scaleway-dns-creds
                key: SCW_ACCESS_KEY
              secretKeySecretRef:
                name: scaleway-dns-creds
                key: SCW_SECRET_KEY
