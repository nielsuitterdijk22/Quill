# Zitadel — OIDC identity provider (SSO/SCIM). DB lives on the same RDB instance
# (database `zitadel`, user `zitadel`). First-instance bootstrap (admin login +
# machine PAT) comes from the steps.yaml ConfigMap, created by
# scripts/bootstrap-cluster.sh from deploy/compose/zitadel/steps.yaml.
# Public host: auth.<domain> via an h2c IngressRoute (Zitadel speaks gRPC/h2c).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: quill
  labels: { app: zitadel }
spec:
  replicas: 1
  selector:
    matchLabels: { app: zitadel }
  template:
    metadata:
      labels: { app: zitadel }
    spec:
      initContainers:
        - name: fix-output-perms
          image: alpine:3
          command: ["sh", "-c", "chmod 0777 /output"]
          volumeMounts:
            - { name: zitadel-out, mountPath: /output }
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:v2.65.1
          command:
            - start-from-init
            - --masterkey
            - $(ZITADEL_MASTERKEY)
            - --tlsMode
            - external
            - --steps
            - /steps.yaml
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: quill-config }
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: ZITADEL_MASTERKEY } }
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: ZITADEL_DB_PASSWORD } }
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: quill-app-secrets, key: RDB_ADMIN_PASSWORD } }
          volumeMounts:
            - { name: steps, mountPath: /steps.yaml, subPath: steps.yaml }
            - { name: zitadel-out, mountPath: /output }
          readinessProbe:
            exec: { command: ["/app/zitadel", "ready"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: steps
          configMap: { name: zitadel-steps }
        - name: zitadel-out
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel
  namespace: quill
  labels: { app: zitadel }
spec:
  selector: { app: zitadel }
  ports:
    - { name: http, port: 8080, targetPort: http }
