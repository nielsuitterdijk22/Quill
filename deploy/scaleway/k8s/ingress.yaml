# Public entrypoints. TLS via cert-manager (ClusterIssuer letsencrypt-scaleway,
# DNS-01 through Scaleway DNS — installed by scripts/bootstrap-cluster.sh).
# Kapsule's built-in Traefik ingress (ingressClassName: traefik) serves HTTP(S).

# ---- app.<domain> → web ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quill-app
  namespace: quill
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-scaleway
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["app.${QUILL_DOMAIN}"]
      secretName: quill-app-tls
  rules:
    - host: "app.${QUILL_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 3001 } }
---
# ---- git.<domain> → forgejo ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quill-git
  namespace: quill
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-scaleway
    # git smart-HTTP can use large request bodies (pushes)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["git.${QUILL_DOMAIN}"]
      secretName: quill-git-tls
  rules:
    - host: "git.${QUILL_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: forgejo, port: { number: 3000 } }
---
# ---- auth.<domain> → zitadel (h2c — Zitadel serves gRPC over HTTP/2 cleartext) ----
# Traefik CRD route so we can set the backend scheme to h2c.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: quill-auth
  namespace: quill
spec:
  entryPoints: ["websecure"]
  routes:
    - match: Host(`auth.${QUILL_DOMAIN}`)
      kind: Rule
      services:
        - name: zitadel
          port: 8080
          scheme: h2c
  tls:
    secretName: quill-auth-tls
---
# ---- cert-manager certificates for the three hosts ----
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quill-app-tls
  namespace: quill
spec:
  secretName: quill-app-tls
  dnsNames: ["app.${QUILL_DOMAIN}"]
  issuerRef: { name: letsencrypt-scaleway, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quill-git-tls
  namespace: quill
spec:
  secretName: quill-git-tls
  dnsNames: ["git.${QUILL_DOMAIN}"]
  issuerRef: { name: letsencrypt-scaleway, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quill-auth-tls
  namespace: quill
spec:
  secretName: quill-auth-tls
  dnsNames: ["auth.${QUILL_DOMAIN}"]
  issuerRef: { name: letsencrypt-scaleway, kind: ClusterIssuer }
