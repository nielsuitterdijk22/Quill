#cloud-config
# First-boot setup for the Forgejo VM: install Docker, write the compose stack
# and its env, start it. Re-runs are safe (idempotent).

ssh_authorized_keys:
  - ${ssh_public_key}

write_files:
  - path: /opt/quill/Caddyfile
    content: |
      ${git_host} {
        reverse_proxy forgejo:3000
      }

      auth.${domain} {
        reverse_proxy h2c://zitadel:8080
      }
  - path: /opt/quill/docker-compose.yml
    content: |
      name: quill-vm
      services:
        forgejo:
          image: codeberg.org/forgejo/forgejo:15
          restart: unless-stopped
          environment:
            USER_UID: "1000"
            USER_GID: "1000"
            FORGEJO__database__DB_TYPE: postgres
            FORGEJO__database__HOST: ${forgejo_db_host}
            FORGEJO__database__PORT: "${forgejo_db_port}"
            FORGEJO__database__NAME: forgejo
            FORGEJO__database__USER: ${forgejo_db_user}
            FORGEJO__database__PASSWD: ${forgejo_db_password}
            FORGEJO__database__SSL_MODE: disable
            FORGEJO__server__DOMAIN: ${git_host}
            FORGEJO__server__ROOT_URL: https://${git_host}/
            FORGEJO__server__SSH_DOMAIN: ssh.${domain}
            FORGEJO__server__SSH_PORT: "2222"
            FORGEJO__security__INSTALL_LOCK: "true"
            FORGEJO__service__DISABLE_REGISTRATION: "true"
            FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
            FORGEJO__server__LFS_START_SERVER: "true"
            %{~ if brevo_enabled ~}
            # Transactional mail for PR notifications etc. (Brevo relay, port 587
            # STARTTLS -> IS_TLS_ENABLED=false). Applied by CI as a compose
            # override on the running VM as well (see deploy-scaleway.yml).
            FORGEJO__mailer__ENABLED: "true"
            FORGEJO__mailer__MAILER_TYPE: smtp
            FORGEJO__mailer__HOST: ${brevo_host_port}
            FORGEJO__mailer__USER: ${brevo_smtp_user}
            FORGEJO__mailer__PASSWD: ${brevo_smtp_password}
            FORGEJO__mailer__FROM: ${brevo_from}
            FORGEJO__mailer__SUBJECT_PREFIX: "[Quill] "
            FORGEJO__mailer__IS_TLS_ENABLED: "false"
            %{~ endif ~}
          ports:
            - "127.0.0.1:3000:3000"
            - "2222:2222"
          volumes:
            - forgejo-data:/data
          depends_on:
            forgejo-db:
              condition: service_healthy
          healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12

        # Forgejo's Postgres, local to this VM (named volume). The serverless
        # "forgejo" SDB was removed: Forgejo's persistent connection pool kept
        # it at ~0.22 vCPU 24/7 (~EUR 22/mo CPU). Backups: the forgejo-backup
        # sidecar's `forgejo dump` includes the database dump.
        forgejo-db:
          image: postgres:16-alpine
          restart: unless-stopped
          environment:
            POSTGRES_USER: ${forgejo_db_user}
            POSTGRES_PASSWORD: ${forgejo_db_password}
            POSTGRES_DB: forgejo
          volumes:
            - forgejo-pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${forgejo_db_user} -d forgejo"]
            interval: 5s
            timeout: 5s
            retries: 12

        dispatch:
          image: ${backend_image}
          restart: unless-stopped
          command: ["/quill-dispatch"]
          # The backend image runs as the unprivileged quill user; the host
          # docker socket is root:<docker-gid>. Without the socket group the
          # act runner cannot dial Docker and every pipeline job fails
          # instantly with no step logs - so add the engine's gid.
          group_add:
            - "${docker_gid}"
          environment:
            QUILL_ENV: production
            QUILL_HTTP_ADDR: ":8090"
            QUILL_LOG_FORMAT: json
            QUILL_PIPELINE_DISPATCH_SECRET: ${dispatch_secret}
            DOCKER_HOST: unix:///var/run/docker.sock
            # Slim but Actions-compatible runner image (~200MB, Debian+node);
            # the fat catthehacker/ubuntu:act-* images do not fit the VM disk.
            QUILL_PIPELINE_UBUNTU_IMAGE: node:22-bookworm
          ports:
            - "8090:8090"  # called by the api container; HMAC-protected
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
          depends_on:
            forgejo:
              condition: service_healthy

        # Daily `forgejo dump` -> Object Storage (shares the git volume).
        forgejo-backup:
          image: ${backup_image}
          restart: unless-stopped
          command: ["/usr/local/bin/backup-forgejo.sh"]
          environment:
            S3_ENDPOINT: ${s3_endpoint}
            BACKUP_BUCKET: ${backup_bucket}
            AWS_ACCESS_KEY_ID: ${aws_access_key}
            AWS_SECRET_ACCESS_KEY: ${aws_secret_key}
            BACKUP_RETENTION_DAYS: "${backup_retention}"
            FORGEJO_CONF: /data/gitea/conf/app.ini
          volumes:
            - forgejo-data:/data

        zitadel-db:
          image: postgres:16-alpine
          restart: unless-stopped
          environment:
            POSTGRES_USER: zitadel
            POSTGRES_PASSWORD: ${zitadel_db_password}
            POSTGRES_DB: zitadel
          volumes:
            - zitadel-pgdata:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U zitadel"]
            interval: 5s
            timeout: 5s
            retries: 12

        zitadel:
          image: ${zitadel_image}
          restart: unless-stopped
          environment:
            ZITADEL_MASTERKEY: ${zitadel_masterkey}
            ZITADEL_EXTERNALDOMAIN: auth.${domain}
            ZITADEL_EXTERNALPORT: "443"
            ZITADEL_EXTERNALSECURE: "true"
            ZITADEL_TLS_MODE: external
            ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
            ZITADEL_DATABASE_POSTGRES_PORT: "5432"
            ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
            ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
            ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${zitadel_db_password}
            ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
            ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
            ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${zitadel_db_password}
            ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
            %{~ if brevo_enabled ~}
            # SMTP for invites / activation / password-reset mails. NOTE: these
            # env vars are only read when the Zitadel instance is created; on
            # the already-running instance CI applies the same settings through
            # the admin API (scripts/zitadel-smtp.sh). TLS=true = implicit TLS
            # with automatic STARTTLS fallback (Brevo port 587).
            ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: ${brevo_host_port}
            ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ${brevo_smtp_user}
            ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ${brevo_smtp_password}
            ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "true"
            ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: ${brevo_from}
            ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: ${brevo_from_name}
            ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_REPLYTOADDRESS: ${brevo_from}
            %{~ endif ~}
          volumes:
            - zitadel-out:/output
          depends_on:
            zitadel-db:
              condition: service_healthy

        # Daily pg_dump of the VM-local zitadel DB -> Object Storage.
        zitadel-backup:
          image: ${backup_image}
          restart: unless-stopped
          command: ["/bin/sh", "-c", "while true; do sleep 3600; STAMP=$(date -u +%Y%m%dT%H%M%SZ); pg_dump -h zitadel-db -U zitadel zitadel | gzip -9 | aws s3 cp - s3://${backup_bucket}/postgres/zitadel/zitadel-$STAMP.sql.gz --endpoint-url ${s3_endpoint}; done"]
          environment:
            PGPASSWORD: ${zitadel_db_password}
            AWS_ACCESS_KEY_ID: ${aws_access_key}
            AWS_SECRET_ACCESS_KEY: ${aws_secret_key}

        caddy:
          image: caddy:2-alpine
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
          volumes:
            - /opt/quill/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
          environment:
            LEGO_EMAIL: ${letsencrypt_email}
          depends_on:
            - forgejo

      volumes:
        forgejo-data:
        forgejo-pgdata:
        caddy-data:
        caddy-config:
        zitadel-pgdata:
        zitadel-out:

runcmd:
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-plugin curl ca-certificates
  - systemctl enable --now docker
  - cd /opt/quill && docker compose pull || true
  - cd /opt/quill && docker compose up -d
