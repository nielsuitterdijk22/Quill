name: secrets
on: [push]
jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: secret is injected and masked
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          test -n "$DEMO_SECRET"
          echo "secret length: ${#DEMO_SECRET}"
          echo "echoing the secret (the log must show it masked): $DEMO_SECRET"
